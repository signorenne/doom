# Builds {{PROJECT}} for the three desktops, each on its own runner.
#
# Linux and Windows need nothing from you. macOS produces an unsigned
# build unless the four secrets below are set; an unsigned app will not
# open on an arm64 Mac, so for anything you hand to someone else, set
# them:
#
#   APPLE_ID                 the developer account's email
#   APPLE_APP_SPECIFIC_PASSWORD   from appleid.apple.com
#   APPLE_TEAM_ID            from the developer portal
#   CSC_LINK, CSC_KEY_PASSWORD    the signing certificate, base64, and its password
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn build

      - name: Package
        run: yarn electron-builder ${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Present only on macOS, and only when the secrets are set.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: {{PROJECT}}-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: ignore
